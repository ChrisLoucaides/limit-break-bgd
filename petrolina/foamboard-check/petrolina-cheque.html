:root {
  --blue:        #00529B;
  --blue-bright: #009CDE;
  --blue-deep:   #003087;
  --navy:        #0A1F45;
  --paper:       #F6F9FC;
  --bleed: 0px;
}

html, body { margin: 0; padding: 0; background: transparent; }
body.bleed { --bleed: 36px; }

@page { size: 2400px 1080px; margin: 0; }

.cheque {
  position: relative;
  width:  calc(2400px + 2 * var(--bleed));
  height: calc(1080px + 2 * var(--bleed));
  border-radius: 28px;
  overflow: hidden;
  background:
    radial-gradient(50% 70% at 60% 60%, #FFFFFF, transparent 70%),
    linear-gradient(180deg, #F8FBFE 0%, #E7F0F9 100%);
  font-family: "Saira SC", "Bahnschrift", "Arial Narrow", sans-serif;
  color: var(--navy);
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
body.bleed .cheque { border-radius: 0; }

/* header and footer bands run into the bleed, so they live outside .inner */
.band-top {
  position: absolute; left: 0; right: 0; top: 0;
  height: calc(250px + var(--bleed));
  background:
    radial-gradient(40% 120% at 72% 0%, rgba(0,156,222,0.45), transparent 70%),
    linear-gradient(100deg, #0B67BD 0%, #00529B 40%, #00438D 70%, #002F72 100%);
  overflow: hidden;
}
.band-top .stripes {
  position: absolute; left: 900px; top: -100px; width: 1800px; height: 500px;
  transform: skewX(-24deg);
  background:
    linear-gradient(90deg, transparent 30%, rgba(0,156,222,0.30) 30%, rgba(0,156,222,0.30) 34%, transparent 34%),
    linear-gradient(90deg, transparent 36%, rgba(255,255,255,0.10) 36%, rgba(255,255,255,0.10) 37.4%, transparent 37.4%),
    linear-gradient(90deg, transparent 72%, rgba(0,32,100,0.35) 72%, rgba(0,32,100,0.35) 80%, transparent 80%);
}
.band-top .hatch {
  position: absolute; left: 700px; top: 0; width: 1800px; height: 100%;
  background: repeating-linear-gradient(112deg, rgba(255,255,255,0.05) 0 3px, transparent 3px 26px);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 40%);
          mask-image: linear-gradient(90deg, transparent, #000 40%);
}

.checker {
  position: absolute; left: 0; right: 0;
  top: calc(250px + var(--bleed)); height: 36px;
  background-color: #FFFFFF;
  background-image:
    linear-gradient(45deg, var(--navy) 25%, transparent 25%, transparent 75%, var(--navy) 75%),
    linear-gradient(45deg, var(--navy) 25%, transparent 25%, transparent 75%, var(--navy) 75%);
  background-size: 36px 36px;
  background-position: calc(var(--bleed) * -1) 0, calc(18px - var(--bleed)) 18px;
}
.checker::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 6px;
  background: var(--blue-bright);
}

.band-bottom {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: calc(34px + var(--bleed));
  background: linear-gradient(100deg, #0B67BD, #00529B 40%, #002F72);
}
.band-bottom::before {
  content: ""; position: absolute; left: 0; right: 0; top: -6px; height: 6px;
  background: var(--blue-bright);
}

.inner {
  position: absolute;
  left: var(--bleed); top: var(--bleed);
  width: 2400px; height: 1080px;
}
.inner > * { position: absolute; }

.guilloche { left: 0; top: 0; width: 2400px; height: 1080px; }

/* ---------- header content ---------- */

.logo {
  left: 70px; top: 36px; height: 178px;
  filter: drop-shadow(0 10px 22px rgba(0,16,50,0.45));
}

.title {
  right: 90px; top: 58px;
  display: flex; align-items: center; gap: 30px;
  color: #FFFFFF;
  font-weight: 800; font-size: 118px; line-height: 1;
  letter-spacing: 0.05em;
  text-shadow: 0 6px 18px rgba(0,16,50,0.40);
}
.title small {
  display: block;
  font-weight: 700; font-size: 30px; letter-spacing: 0.42em;
  color: rgba(255,255,255,0.78);
  margin-top: 10px; text-align: right;
  text-shadow: none;
}

/* the stinger's slanted speed marks */
.marks { display: flex; gap: 10px; }
.marks s {
  display: block; width: 16px; height: 86px;
  background: var(--blue-bright);
  transform: skewX(-24deg);
  box-shadow: 0 0 18px rgba(0,156,222,0.6);
}
.marks s:nth-child(1) { opacity: 0.45; }
.marks s:nth-child(2) { opacity: 0.72; }
.marks.small { gap: 6px; }
.marks.small s { width: 8px; height: 30px; box-shadow: none; }

/* ---------- fields ---------- */

.label {
  display: flex; align-items: center; gap: 16px;
  font-weight: 700; font-size: 34px; line-height: 1.05;
  letter-spacing: 0.12em;
  color: var(--blue);
}
.line {
  height: 5px; border-radius: 3px;
  background: var(--navy);
}

.f-date       { left: 1686px; top: 372px; }
.l-date       { left: 1846px; top: 410px; width: 474px; }

.f-pay        { left: 90px;  top: 520px; }
.l-pay        { left: 470px; top: 600px; width: 1210px; }

.amount {
  left: 1790px; top: 488px; width: 530px; height: 150px;
  box-sizing: border-box;
  background: #FFFFFF;
  border: 5px solid var(--blue);
  border-radius: 18px;
  box-shadow: 0 10px 26px rgba(0,48,135,0.14), inset 0 0 0 8px rgba(0,156,222,0.10);
  display: flex; align-items: center;
}
.amount .cur {
  width: 128px; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 92px; color: #FFFFFF;
  background: var(--blue);
  border-radius: 10px 0 0 10px;
}

.f-sum        { left: 90px;  top: 700px; }
.l-sum        { left: 470px; top: 752px; width: 1850px; }

.sig {
  left: 1640px; top: 900px; width: 680px;
}
.sig .line { width: 100%; }
.sig .cap {
  margin-top: 16px;
  font-weight: 700; font-size: 26px; letter-spacing: 0.3em;
  color: var(--blue); text-align: center;
}

.micr {
  left: var(--micr-left, 90px); top: 950px;
  display: flex; align-items: center; gap: 26px;
  font-family: "Consolas", "OCR A Extended", monospace;
  font-size: 40px; letter-spacing: 0.14em;
  color: rgba(10,31,69,0.72);
}
.micr i {
  display: inline-block; width: 26px; height: 34px;
  background:
    linear-gradient(currentColor, currentColor) 0 0 / 8px 100% no-repeat,
    linear-gradient(currentColor, currentColor) 14px 8px / 12px 18px no-repeat;
  opacity: 0.9;
}
/* event / community logos, bottom left on the light paper where their
   orange, purple and olive read cleanly */
.partners {
  left: 90px; top: 800px; height: 200px;
  display: flex; align-items: center; gap: 44px;
}
.partners img { display: block; height: 100%; width: auto; }
.partners img.ccc { height: 176px; }
.partners .divider {
  width: 4px; height: 150px; border-radius: 2px;
  background: linear-gradient(180deg, transparent, rgba(0,82,155,0.35), transparent);
}
.has-partners .micr { --micr-left: 900px; }
</style>
</head>

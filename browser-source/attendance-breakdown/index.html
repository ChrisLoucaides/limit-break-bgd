<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Attendance Breakdown</title>
<!--
  1920x1080 animated OBS browser source for the SSBU attendance breakdown.
  Self-contained: everything it loads lives in ./assets.
  Data: edit the ROWS list in the script. Options via query string (see README.md):
    bg=0      transparent background (card, header and border stay)
    loop=N    replay the intro every N seconds
    hold=1    skip the intro and show the finished state
    t=N       freeze the intro at N seconds (preview)
-->
<style>
  @font-face { font-family: "Bebas Neue"; src: url("assets/fonts/BebasNeue-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url("assets/fonts/BarlowCondensed-700.woff2") format("woff2"); }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }

  .frame {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: "Barlow Condensed", sans-serif;
    color: #fff;
  }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 55% at 0% 100%, rgba(0,212,255,0.16), transparent 70%),
      radial-gradient(ellipse 65% 55% at 100% 0%, rgba(238,0,204,0.16), transparent 70%),
      linear-gradient(180deg, rgba(4,6,18,0.35) 0%, rgba(4,6,18,0.55) 100%),
      #08081A url("assets/lb-bg-1920x1080.png") center / cover no-repeat;
  }
  body.nobg .bg { display: none; }
  .border {
    position: absolute; inset: 0;
    padding: 12px;
    background: linear-gradient(180deg, #FF14F0 0%, #8A7CFF 50%, #0AF0FF 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    z-index: 10;
  }
  .chroma {
    text-shadow: -4px 0 0 #0AF0FF, 4px 0 0 #FF14F0, 0 6px 20px rgba(0,0,0,0.55);
  }

  /* ---------- header ---------- */
  .header {
    position: absolute;
    top: 40px; left: 80px; right: 80px;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 2;
  }
  .lb-logo { height: 146px; filter: drop-shadow(0 6px 16px rgba(0,0,0,0.5)); }
  .ssbu-logo { height: 78px; filter: drop-shadow(0 5px 14px rgba(0,0,0,0.6)); }
  .title {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    white-space: nowrap;
  }
  .title h1 {
    margin: 0;
    font-family: "Bebas Neue", sans-serif;
    font-weight: 400;
    font-size: 124px;
    line-height: 1;
    letter-spacing: 0.02em;
  }

  /* ---------- label ---------- */
  .label {
    position: absolute;
    top: 214px; left: 80px; right: 80px;
    height: 54px;
    display: flex;
    align-items: center;
    gap: 18px;
    font-family: "Bebas Neue", sans-serif;
    font-size: 50px;
    letter-spacing: 0.04em;
    line-height: 1;
    z-index: 2;
  }
  .label .grad {
    background: linear-gradient(90deg, #0AF0FF 0%, #FF14F0 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 3px 10px rgba(0,0,0,0.6));
  }
  .label .rule {
    flex: 1;
    height: 3px;
    background: linear-gradient(90deg, rgba(255,255,255,0.55), rgba(255,255,255,0));
    transform-origin: left center;
  }

  /* ---------- card ---------- */
  .card {
    position: absolute;
    left: 80px; top: 290px;
    width: 1760px; height: 730px;
    border-radius: 8px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 50% 50% at 15% 10%, rgba(138,124,255,0.16), transparent 70%),
      rgba(15,15,38,0.88);
    box-shadow: -6px 0 0 #0AF0FF, 6px 0 0 #FF14F0, 0 20px 50px rgba(0,0,0,0.6);
    z-index: 2;
    padding: 26px 44px 0;
    display: flex;
    flex-direction: column;
  }

  .rows { display: flex; flex-direction: column; gap: 10px; }
  .row {
    display: grid;
    grid-template-columns: 120px 1fr 170px;
    align-items: center;
    column-gap: 30px;
    height: 86px;
  }
  .flag {
    width: 114px; height: 76px;
    object-fit: cover;
    border-radius: 4px;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.9), 0 5px 14px rgba(0,0,0,0.5);
  }
  .info { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .country {
    font-family: "Bebas Neue", sans-serif;
    font-size: 50px;
    line-height: 0.9;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .track {
    height: 14px;
    border-radius: 7px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .bar {
    position: relative;
    height: 100%;
    border-radius: 7px;
    background: linear-gradient(90deg, #0AF0FF 0%, #8A7CFF 55%, #FF14F0 100%);
    box-shadow: 0 0 14px rgba(138,124,255,0.55);
    transform-origin: left center;
    overflow: hidden;
  }
  /* idle shine sweeping along each bar */
  .bar::after {
    content: "";
    position: absolute; top: 0; bottom: 0;
    width: 120px; left: -120px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.65), transparent);
  }
  .count {
    font-family: "Bebas Neue", sans-serif;
    font-size: 92px;
    line-height: 0.8;
    text-align: right;
    padding-top: 8px;
    font-variant-numeric: tabular-nums;
  }

  .row.home { height: 120px; }
  .row.home .flag { width: 120px; height: 80px; }
  .row.home .country { font-size: 70px; }
  .row.home .count { font-size: 140px; }
  .row.home .track { height: 20px; border-radius: 10px; }

  .total {
    margin-top: auto;
    height: 84px;
    margin-left: -44px; margin-right: -44px;
    padding: 0 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(90deg, rgba(10,240,255,0.16), rgba(255,20,240,0.16));
    border-top: 2px solid rgba(255,255,255,0.18);
    font-family: "Bebas Neue", sans-serif;
    letter-spacing: 0.04em;
  }
  .total .k { font-size: 48px; }
  .total .k span { color: #0AF0FF; }
  .total .v { font-size: 64px; }

  /* ---------- animation ---------- */
  /* Elements start hidden; body.play runs the intro. Per-row delays come from --d. */
  body.play .bg        { animation: fade .8s ease-out both; }
  body.play .border    { animation: fade .6s ease-out both; }
  body.play .lb-logo   { animation: from-left .7s cubic-bezier(.2,.9,.3,1.2) .3s both; }
  body.play .ssbu-logo { animation: from-right .7s cubic-bezier(.2,.9,.3,1.2) .3s both; }
  body.play .title h1  { animation: glitch-in .9s steps(1) .45s both, glitch 6s steps(1) 4s infinite; }
  body.play .label .grad { animation: wipe .6s ease-out .9s both; }
  body.play .label .rule { animation: grow .8s ease-out 1.1s both; }
  body.play .card      { animation: rise .7s cubic-bezier(.2,.9,.3,1) 1.1s both; }
  body.play .row       { animation: from-left-sm .55s cubic-bezier(.2,.9,.3,1.1) var(--d) both; }
  body.play .row .flag { animation: flip .6s ease-out var(--d) both; }
  body.play .bar       { animation: grow 1.2s cubic-bezier(.2,.8,.2,1) calc(var(--d) + .25s) both; }
  body.play .bar::after{ animation: shine 3.5s ease-in-out calc(var(--d) + 2.5s) infinite; }
  body.play .total     { animation: up .6s ease-out var(--td) both; }

  body:not(.play) .frame { visibility: hidden; }
  body.hold * { animation-delay: -60s !important; }
  body.hold .title h1 { animation-delay: -60s, 0s !important; }

  @keyframes fade        { from { opacity: 0; } }
  @keyframes from-left   { from { opacity: 0; transform: translateX(-160px); } }
  @keyframes from-right  { from { opacity: 0; transform: translateX(160px); } }
  @keyframes from-left-sm{ from { opacity: 0; transform: translateX(-60px); } }
  @keyframes rise        { from { opacity: 0; transform: translateY(60px) scale(.98); } }
  @keyframes up          { from { opacity: 0; transform: translateY(40px); } }
  @keyframes grow        { from { transform: scaleX(0); } }
  @keyframes wipe        { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes flip        { from { opacity: 0; transform: perspective(400px) rotateY(-90deg); } }
  @keyframes shine       { 0% { left: -120px; } 45%, 100% { left: 100%; } }
  @keyframes glitch-in {
    0%   { opacity: 0; }
    10%  { opacity: 1; transform: translateX(-14px) skewX(-12deg); text-shadow: -14px 0 0 #0AF0FF, 14px 0 0 #FF14F0; }
    25%  { opacity: 0; }
    35%  { opacity: 1; transform: translateX(10px); text-shadow: 10px 0 0 #0AF0FF, -10px 0 0 #FF14F0; clip-path: inset(20% 0 40% 0); }
    50%  { transform: translateX(-4px); clip-path: inset(0 0 0 0); text-shadow: -8px 0 0 #0AF0FF, 8px 0 0 #FF14F0; }
    70%, 100% { opacity: 1; transform: none; }
  }
  @keyframes glitch {
    0%, 94%, 100% { transform: none; clip-path: inset(0 0 0 0); }
    95% { transform: translateX(-8px) skewX(-8deg); text-shadow: -10px 0 0 #0AF0FF, 10px 0 0 #FF14F0; }
    96% { transform: translateX(6px); clip-path: inset(30% 0 35% 0); }
    97% { transform: translateX(-3px); clip-path: inset(0 0 0 0); }
  }
</style>
</head>
<body>
<div class="frame">
  <div class="bg"></div>
  <div class="border"></div>

  <div class="header">
    <img class="lb-logo" src="assets/limit-break-logo.png" alt="Limit Break">
    <div class="title">
      <h1 class="chroma">ATTENDANCE BREAKDOWN</h1>
    </div>
    <img class="ssbu-logo" src="assets/ssbu-logo.png" alt="Super Smash Bros. Ultimate">
  </div>

  <div class="label">
    <span class="grad">PLAYERS BY COUNTRY</span>
    <span class="rule"></span>
  </div>

  <div class="card">
    <div class="rows" id="rows"></div>
    <div class="total" id="totalbar">
      <span class="k" id="intl"></span>
      <span class="v chroma"><span id="total">0</span> PLAYERS</span>
    </div>
  </div>
</div>

<script>
  const HOME = "cy";
  const ROWS = [
    { code: "cy", name: "Cyprus",         n: 35 },
    { code: "gb", name: "United Kingdom", n: 6 },
    { code: "gr", name: "Greece",         n: 4 },
    { code: "us", name: "United States",  n: 1 },
    { code: "it", name: "Italy",          n: 1 },
    { code: "ua", name: "Ukraine",        n: 1 },
  ].sort((a, b) => b.n - a.n);

  const ROW_START = 1.5, ROW_STEP = 0.18;   // seconds

  const p = new URLSearchParams(location.search);
  const $ = id => document.getElementById(id);
  const max = Math.max(...ROWS.map(r => r.n));
  const total = ROWS.reduce((s, r) => s + r.n, 0);
  const abroad = ROWS.filter(r => r.code !== HOME).reduce((s, r) => s + r.n, 0);
  const delay = i => ROW_START + i * ROW_STEP;
  const totalDelay = delay(ROWS.length) + 0.2;

  if (p.get("bg") === "0") document.body.classList.add("nobg");

  $("rows").innerHTML = ROWS.map((r, i) => `
    <div class="row${r.code === HOME ? " home" : ""}" style="--d:${delay(i)}s">
      <img class="flag" src="assets/flags/${r.code}.svg" alt="">
      <div class="info">
        <span class="country chroma">${r.name.toUpperCase()}</span>
        <div class="track"><div class="bar" style="width:${Math.max(3, r.n / max * 100)}%"></div></div>
      </div>
      <span class="count chroma" data-n="${r.n}" data-d="${delay(i) + 0.25}">0</span>
    </div>`).join("");
  $("totalbar").style.setProperty("--td", totalDelay + "s");
  $("total").dataset.n = total;
  $("total").dataset.d = totalDelay;
  $("intl").innerHTML = `${ROWS.length} COUNTRIES <span>·</span> ${abroad} FROM ABROAD`;

  let raf;
  function countUp(hold) {
    const els = [...document.querySelectorAll("[data-n]")];
    if (hold) { els.forEach(el => el.textContent = el.dataset.n); return; }
    const t0 = performance.now();
    const ease = t => 1 - Math.pow(1 - t, 3);
    const tick = now => {
      const s = (now - t0) / 1000;
      let done = true;
      for (const el of els) {
        const t = Math.min(1, Math.max(0, (s - el.dataset.d) / 1.1));
        el.textContent = Math.round(ease(t) * el.dataset.n);
        if (t < 1) done = false;
      }
      if (!done) raf = requestAnimationFrame(tick);
    };
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
  }

  function play() {
    const hold = p.get("hold") === "1";
    document.body.classList.remove("play");
    void document.body.offsetWidth;          // restart CSS animations
    document.body.classList.toggle("hold", hold);
    document.body.classList.add("play");
    const t = parseFloat(p.get("t"));
    if (t >= 0) return freeze(t);
    countUp(hold);
  }

  // ?t=2.5 freezes the intro at 2.5s, for previewing / screenshots
  function freeze(t) {
    document.getAnimations().forEach(a => { a.pause(); a.currentTime = t * 1000; });
    const ease = x => 1 - Math.pow(1 - x, 3);
    document.querySelectorAll("[data-n]").forEach(el => {
      const x = Math.min(1, Math.max(0, (t - el.dataset.d) / 1.1));
      el.textContent = Math.round(ease(x) * el.dataset.n);
    });
  }

  // wait for fonts + images so the intro doesn't start on a half-loaded page
  Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => {}))])
    .then(play);

  const loop = parseFloat(p.get("loop"));
  if (loop > 0) setInterval(play, loop * 1000);
</script>
</body>
</html>
